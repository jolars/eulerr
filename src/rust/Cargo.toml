[package]
name = "eulerr"
publish = false
version = "0.0.0"
edition = "2024"
rust-version = "1.88.0"

[lib]
crate-type = ["rlib", "staticlib"]
name = "eulerr"

[[bin]]
name = "document"
path = "document.rs"

[dependencies]
extendr-api = "0.9"
eunoia = { version = "1.10.1", features = ["parallel"] }

[profile.release]
lto = true
codegen-units = 1
